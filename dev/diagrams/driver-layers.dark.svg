<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">PCAL95555&lt;I2c&gt;, inc/pcal95555.hpp</text>
<text x="56" y="632.4" font-size="20" font-weight="700" fill="#C7CBFF">Communication interface</text>
<text x="56" y="663" font-size="17" fill="#D2DAE4">pcal95555::I2cInterface&lt;Self&gt;: CRTP, no virtual calls; variant detection, retries and</text>
<text x="56" y="687.7" font-size="17" fill="#D2DAE4">the Agile I/O guard live in the core above, so the interface only moves register bytes</text>
<text x="56" y="786.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="815.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">required:  Write()  Read()  EnsureInitialized()</text>
<text x="56" y="838.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">optional:  SetAddressPins()  RegisterInterruptHandler()  GpioSet()  GpioRead()</text>
<text x="56" y="937.4" font-size="20" font-weight="700" fill="#E8EDF3">PCA9555 / PCAL9555A</text>
<text x="56" y="968" font-size="17" fill="#D2DAE4">I2C up to 400 kHz, address 0x20-0x27 (A2 A1 A0)  /  INT open drain, active low</text>
